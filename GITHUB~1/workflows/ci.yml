name: CI

# Validates the app on every push / PR — independent of any local sandbox.
# Catches syntax errors and import problems before Render ever deploys.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Compile all modules (syntax check)
        run: python -m compileall -q .

      - name: Static checks (undefined names, bad imports)
        run: python -m pyflakes db.py scraper.py worker.py app.py export.py

      - name: Import smoke test (db + scraper load, schema builds)
        env:
          CD_DB_PATH: /tmp/ci.db
        run: |
          python -c "import db, scraper, export, worker; db.init_db('/tmp/ci.db'); print('imports OK, schema built')"
